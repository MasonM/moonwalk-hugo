<figure>
	<model-viewer
		src="{{ .Get "src" }}"
		alt="3D Model"
		camera-controls
		camera-orbit="{{ .Get "camera-orbit" }}"
		field-of-view="30deg"
		style="width: 100%; {{ .Get "style" | safeCSS }}"
	>
	</model-viewer>
	{{ if .Get "caption" }}
	<figcaption>{{ .Get "caption" | .Page.RenderString }}</figcaption>
	{{ end }}
</figure>
