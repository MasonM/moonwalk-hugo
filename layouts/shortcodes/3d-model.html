{{ $model := resources.Get (.Get "src") }}
{{ if $model }}
<model-viewer
	src="{{ $model.RelPermalink }}"
	alt="3D Model"
	camera-controls
	camera-orbit="{{ .Get "camera-orbit" }}"
	field-of-view="30deg"
	style="width: 100%; height: 400px; background-color: #ffffff"
>
</model-viewer>
{{ else }}
<p style="color: red">Model not found: {{ .Get "src" }}</p>
{{ end }}
